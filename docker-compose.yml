# ============================================================
#  Ecosistema e-commerce: Frontend (Next.js) + API (Laravel) + MySQL
#  Levantar todo:   docker compose up -d --build
#  Variables:       copia .env.example a .env y completa los valores
# ============================================================
name: ecommerce

services:
  # ---------- Base de datos ----------
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_DATABASE:-ecommerce_api}
      MYSQL_USER: ${DB_USERNAME:-ecommerce}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql                                # datos persistentes
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro    # script de inicialización (solo 1.ª vez)
    # Sin "ports": el 3306 solo es visible dentro de la red interna
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true

  # ---------- API Laravel (PHP-FPM + Nginx) ----------
  backend:
    build:
      context: ./backend
    image: ecommerce-backend:1.0
    restart: unless-stopped
    environment:
      APP_NAME: "API E-commerce"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env (ver README)}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_LOCALE: es
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ecommerce_api}
      DB_USERNAME: ${DB_USERNAME:-ecommerce}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (ver README)}
      JWT_TTL: ${JWT_TTL:-60}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      L5_SWAGGER_GENERATE_ALWAYS: "false"
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: ${SEED_DATABASE:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"   # API + Swagger en http://localhost:8000/api/documentation
    networks:
      - backend-net    # habla con MySQL
      - frontend-net   # recibe peticiones del frontend (y sale a internet para Stripe)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------- Frontend Next.js ----------
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:-}
    image: ecommerce-frontend:1.0
    restart: unless-stopped
    environment:
      # Server Components y Server Actions llaman a la API por la red interna de Docker
      API_BASE_URL: http://backend:8000/api
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - frontend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  db_data:

networks:
  frontend-net:
  backend-net:
    internal: true   # MySQL queda aislado: sin acceso a internet ni al frontend
